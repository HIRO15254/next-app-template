fragment UserDataFragment on UserData {
    nodeId
    id
    name
    email
    image
    userId
}

query loginUserData {
    loginUserData {
        ...UserDataFragment
    }
}

mutation UpdateUser($nodeId: ID!, $data: UserDataUpdateInput!){
    updateUserDataCollection(filter: {nodeId: {eq: $nodeId}}, set: $data, atMost: 1) {
        affectedCount
    }
}
